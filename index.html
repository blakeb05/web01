<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Journey Together</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="decorative-border"></div>
        
        <div class="main-content">
            <div class="heart-decoration">💕</div>
            
            <h1 class="main-title">A Journey Together</h1>
            <p class="subtitle">Let's explore our beautiful memories...</p>
            
            <div class="flower-decals">
                <span class="flower">🌸</span>
                <span class="flower">🌹</span>
                <span class="flower">🌺</span>
            </div>
            
            <button class="start-btn" onclick="startQuiz()">
                Begin Our Story
                <span class="btn-heart">💖</span>
            </button>
            
            <div class="gallery-link-container" id="galleryAccess" style="display: none;">
                <div class="unlock-message">
                    <span class="sparkle">✨</span>
                    Gallery Unlocked!
                    <span class="sparkle">✨</span>
                </div>
                <a href="gallery.html" class="gallery-btn">
                    View Our Memories
                    <span class="gallery-icon">📸</span>
                </a>
            </div>
        </div>
        
        <div class="floating-hearts">
            <span class="floating-heart">💝</span>
            <span class="floating-heart">💞</span>
            <span class="floating-heart">💕</span>
            <span class="floating-heart">💖</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
